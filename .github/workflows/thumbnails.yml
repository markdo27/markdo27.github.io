name: Thumbnails

# Recaptures the tool thumbnails from the live sites and commits them.
#
# Runs on its own whenever the capture setup changes, on any branch, and by
# hand from the Actions tab: Thumbnails, Run workflow. Leave "only" blank for
# every tool, or give slugs (nuftext,visual) to redo just those.

on:
  workflow_dispatch:
    inputs:
      only:
        description: Comma separated data-tool slugs to recapture (blank for all)
        required: false
        default: ''
  push:
    paths:
      - tools/thumbs/**
      - .github/workflows/thumbnails.yml

# Only to commit the images. Pages redeploys on its own: a push made with
# GITHUB_TOKEN does start the Pages build, as the first run on main showed.
permissions:
  contents: write

concurrency:
  group: thumbnails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from
    # 19 Oct 2026. The fonts the shots depend on, CJK for Translaate and
    # colour emoji for Vietlot, were checked on 24.04; move this on purpose,
    # and look at the images when you do.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/thumbs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/thumbs/package-lock.json

      - run: npm ci

      # --with-deps also brings the CJK and emoji fonts the Translaate and
      # Vietlot shots need; without them those render as boxes.
      - run: npx playwright install --with-deps chromium

      - name: Capture
        run: node capture.mjs
        env:
          THUMBS_ONLY: ${{ inputs.only }}

      # Runs even when a capture failed, so the tools that did succeed still
      # land; the failure itself keeps the run red.
      - name: Commit thumbnails
        if: success() || failure()
        working-directory: .
        run: |
          git add thumbs
          if git diff --cached --quiet; then
            echo "Thumbnails unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh tool thumbnails" -m "Captured by the Thumbnails workflow, run ${{ github.run_id }}."
          # The commit only touches thumbs/, so replaying it on top of a
          # newer branch tip cannot conflict with anything else.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
